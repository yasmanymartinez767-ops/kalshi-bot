<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YMC BTC Predictor AI Pro</title><script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#071321;color:#e4edf7;font:15px system-ui}main{max-width:1100px;margin:auto;padding:12px}header{display:flex;align-items:center;gap:12px}header b{color:#e7bb65}h1{font-size:16px;flex:1}select{background:#122436;color:#4ce4ff;border:1px solid #304459;padding:8px;border-radius:6px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.tile{background:#102033;border:1px solid #20374a;border-radius:8px;padding:12px;min-width:0}.tile strong{display:block;margin-top:8px;font-size:15px}.up{color:#27d99a}.down{color:#ff6478}.ai{color:#62baff}#chart{height:55dvh;min-height:300px}#price{font-size:28px;font-weight:650}small{color:#9aafc4}#status{margin:10px 0}#market{overflow-wrap:anywhere}</style></head><body><main><header><b>♛ YMC</b><h1>BTC PREDICTOR AI PRO</h1><select id="tf" aria-label="Temporalidad"><option>1</option><option>5</option><option>10</option><option>15</option></select></header><small>BTC / USD · Coinbase + Kraken</small><div id="price">—</div><div class="cards"><div class="tile ai">IA<strong id="signal">ESPERAR</strong></div><div class="tile up">SUBE<strong id="up">—</strong></div><div class="tile down">BAJA<strong id="down">—</strong></div></div><div id="chart"></div><small>Pronóstico BTC a 15 minutos · no equivale a probabilidad de liquidación Kalshi</small><div id="status" role="status">Conectando…</div><div class="tile"><small>KALSHI · BTC 15M</small><div id="market">—</div><small id="clock">—</small></div></main><script>
const $=id=>document.getElementById(id);let rows=[],partial=null,expiry=0,last=0,ws,previous="";
if(!window.LightweightCharts){$("status").textContent="No se pudo cargar el gráfico";}else{
const chart=LightweightCharts.createChart($("chart"),{autoSize:true,layout:{background:{color:"#071321"},textColor:"#a5b9ce"},grid:{vertLines:{color:"#122336"},horzLines:{color:"#122336"}},timeScale:{timeVisible:true,secondsVisible:false},rightPriceScale:{borderColor:"#20374a"}});
const series=chart.addCandlestickSeries({upColor:"#27d99a",downColor:"#ff6478",borderVisible:false,wickUpColor:"#27d99a",wickDownColor:"#ff6478"});
const volume=chart.addHistogramSeries({priceFormat:{type:"volume"},priceScaleId:""});volume.priceScale().applyOptions({scaleMargins:{top:.82,bottom:0}});
function draw(reset=false){const n=Number($("tf").value),groups=new Map();for(const c of (partial?rows.concat([partial]):rows)){const t=Math.floor(c.ts/(60*n))*60*n;let g=groups.get(t);if(!g){g={time:t,open:c.open,high:c.high,low:c.low,close:c.close,volume:0,count:0};groups.set(t,g)}g.high=Math.max(g.high,c.high);g.low=Math.min(g.low,c.low);g.close=c.close;g.volume+=c.volume;g.count++}const all=[...groups.values()];const a=all.filter((g,i)=>g.count===n||i===all.length-1);const range=reset?null:chart.timeScale().getVisibleRange();series.setData(a);volume.setData(a.map(g=>({time:g.time,value:g.volume,color:g.close>=g.open?"#176d59":"#873c4b"})));if(reset)chart.timeScale().fitContent();else if(range&&a.length)chart.timeScale().setVisibleRange(range)}
$("tf").onchange=()=>draw(true);
function connect(){ws=new WebSocket((location.protocol==="https:"?"wss:":"ws:")+"//"+location.host+"/ws/market");ws.onmessage=e=>{const d=JSON.parse(e.data);last=Date.now();$("status").textContent=d.status==="connected"?"Datos verificados · última vela en formación":"Datos no disponibles";$("signal").textContent=d.status==="connected"?(d.predictions?.["15"]?d.signal:"SIN MODELO"):"ESPERAR";const p=d.predictions?.["15"];$("up").textContent=p?Math.round(p.up*100)+"%":"—";$("down").textContent=p?Math.round(p.down*100)+"%":"—";const next=JSON.stringify([d.candles||[],d.partial_candle||null]);if(next!==previous){const first=!rows.length;rows=d.candles||[];partial=d.partial_candle||null;previous=next;draw(first);const spot=partial?.close??rows.at(-1)?.close;$("price").textContent=spot?spot.toLocaleString("en-US",{style:"currency",currency:"USD"}):"—"}const m=d.kalshi?.[0];$("market").textContent=m?m.ticker+" · YES "+(m.yes_bid_dollars??"—")+" / "+(m.yes_ask_dollars??"—"):"Sin cotización";expiry=m?Date.parse(m.close_time):0};ws.onclose=()=>{$("status").textContent="Desconectado";$("signal").textContent="ESPERAR";$("up").textContent=$("down").textContent="—";$("market").textContent="Sin cotización";expiry=0;setTimeout(connect,3000)};ws.onerror=()=>ws.close()}
connect();setInterval(()=>{if(Date.now()-last>30000){$("signal").textContent="ESPERAR";$("status").textContent="Datos desactualizados";$("up").textContent=$("down").textContent="—";$("market").textContent="Sin cotización";expiry=0}const s=Math.max(0,Math.floor((expiry-Date.now())/1000));$("clock").textContent=expiry?Math.floor(s/60)+":"+String(s%60).padStart(2,"0"):"—"},250)}
</script></body></html>
