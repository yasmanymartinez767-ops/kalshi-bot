
name: Verificar Kalshi Bot

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Comprobar sintaxis Python
        run: |
          python - <<'PY'
          import pathlib
          import sys

          errores = []
          archivos = list(pathlib.Path("backend").rglob("*.py")) + list(pathlib.Path("scripts").rglob("*.py"))
          for archivo in archivos:
              try:
                  compile(
                      archivo.read_bytes(),
                      str(archivo),
                      "exec"
                  )
              except (SyntaxError, ValueError) as e:
                  errores.append(f"{archivo}: {e}")

          for error in errores:
              print(error)

          print(f"Archivos revisados: {len(archivos)}")
          if errores or not archivos:
              sys.exit(1)
          PY

      - name: Probar motor YMC y validacion de velas cerradas
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_ymc_signal.py tests/test_ymc_outcomes.py tests/test_early_exit_research.py

      - name: Comprobar importacion del informe Kalshi sin conectar a produccion
        run: |
          python -m pip install sqlalchemy
          python - <<'PY'
          import ast
          from pathlib import Path
          source = Path("scripts/ymc_kalshi_exit_research.py").read_text()
          tree = ast.parse(source)
          assert any(isinstance(node, ast.FunctionDef) and node.name == "main" for node in tree.body)
          assert any(isinstance(node, ast.If) for node in tree.body)
          print("Informe de Kalshi: estructura validada (sin datos reales)")
          PY

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias React
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Compilar interfaz y velas BTC
        working-directory: frontend
        run: npm run build
