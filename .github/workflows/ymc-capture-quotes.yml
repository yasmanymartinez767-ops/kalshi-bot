name: Capturar cotizaciones reales Kalshi BTC 15m

on:
  workflow_dispatch:
  schedule:
    - cron: '7 */2 * * *'
  push:
    paths:
      - '.github/workflows/ymc-capture-quotes.yml'
      - 'scripts/ymc_analyze_kalshi_quotes.py'
      - 'tests/test_ymc_quote_analysis.py'

permissions:
  contents: read

jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Probar cálculo de oportunidades sin mirar al futuro
        run: python -m unittest discover -s tests -p test_ymc_quote_analysis.py
      - name: Registrar cotizaciones reales sin enviar órdenes
        env:
          YMC_SAMPLE_DURATION_SECONDS: '960'
          YMC_SAMPLE_INTERVAL_SECONDS: '5'
        run: python scripts/ymc_capture_kalshi_quotes.py
      - name: Evaluar oportunidades observadas superiores a 20 centavos
        if: success()
        run: python scripts/ymc_analyze_kalshi_quotes.py kalshi_btc15m_live_quotes.jsonl > kalshi_btc15m_analysis.json
      - name: Mostrar resumen de oportunidades
        if: success()
        run: cat kalshi_btc15m_analysis.json
      - name: Conservar evidencia de cotizaciones
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-btc15m-quotes-${{ github.run_id }}
          path: |
            kalshi_btc15m_live_quotes.jsonl
            kalshi_btc15m_analysis.json
          if-no-files-found: warn
          retention-days: 30
