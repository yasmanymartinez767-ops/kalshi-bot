name: Medir YMC con Coinbase real

on:
  push:
    paths:
      - 'scripts/ymc_coinbase_backtest.py'
      - 'backend/btcmarket/ymc_outcomes.py'
      - 'backend/btcmarket/ymc_signal.py'
      - '.github/workflows/ymc-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Evaluar señales BTC 10 y 15 minutos
        run: |
          PYTHONPATH=. python scripts/ymc_coinbase_backtest.py | tee ymc-research.json
      - name: Guardar resultados verificables
        uses: actions/upload-artifact@v4
        with:
          name: ymc-coinbase-research
          path: ymc-research.json
          retention-days: 30
